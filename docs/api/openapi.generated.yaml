components:
  schemas:
    AliasOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        kind:
          type: string
      required:
      - id
      - kind
      - text
    AllowedActionOut:
      type: object
      properties:
        action:
          type: string
        allowed:
          type: boolean
        reason:
          type: string
          nullable: true
      required:
      - action
      - allowed
      - reason
    ClientInRequest:
      type: object
      description: An unexpected field is refused, so a typo cannot pass as an optional
        field left out.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        sensitivity:
          $ref: '#/components/schemas/SensitivityEnum'
        tone:
          $ref: '#/components/schemas/ToneEnum'
      required:
      - display_name
    ClientOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        normalized_name:
          type: string
        sensitivity:
          type: string
        tone:
          type: string
        version:
          type: integer
      required:
      - display_name
      - id
      - normalized_name
      - sensitivity
      - tone
      - version
    ClientPageOut:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientOut'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    ClientProfileOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        normalized_name:
          type: string
        sensitivity:
          type: string
        tone:
          type: string
        version:
          type: integer
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactOut'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/AliasOut'
        summary:
          $ref: '#/components/schemas/ClientSummaryOut'
      required:
      - aliases
      - contacts
      - display_name
      - id
      - normalized_name
      - sensitivity
      - summary
      - tone
      - version
    ClientSummaryOut:
      type: object
      properties:
        contacts_total:
          type: integer
        contacts_active:
          type: integer
        contacts_suppressed:
          type: integer
      required:
      - contacts_active
      - contacts_suppressed
      - contacts_total
    ContactInRequest:
      type: object
      description: An unexpected field is refused, so a typo cannot pass as an optional
        field left out.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - email
    ContactOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        status:
          type: string
        suppression_reason:
          type: string
          nullable: true
      required:
      - client_id
      - email
      - id
      - name
      - status
      - suppression_reason
    CredentialsInRequest:
      type: object
      description: An unexpected field is refused, so a typo cannot pass as an optional
        field left out.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - email
      - password
    DetailOut:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailInRequest:
      type: object
      description: An unexpected field is refused, so a typo cannot pass as an optional
        field left out.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    HealthOut:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ImportBatchOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        file_name:
          type: string
        scan_status:
          type: string
        headers:
          type: array
          items:
            type: string
        suggested_mapping:
          type: object
          additionalProperties:
            type: string
        date_format_options:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
          nullable: true
        date_format:
          type: string
          nullable: true
        counts:
          type: object
