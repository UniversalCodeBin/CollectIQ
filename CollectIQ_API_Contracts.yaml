components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: HttpOnly, Secure, SameSite session cookie. Cookie name is an implementation choice [PROP].
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Required on mutating requests. Header name is a Django default [PROP].
  parameters:
    Workspace:
      name: ws
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Aggregate version; mismatch -> 409 CONFLICT_VERSION
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Same key+body replays stored result; different body -> 422 IDEMPOTENCY_MISMATCH
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    Money:
      type: object
      required:
      - amount_minor
      - currency
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Minor units; never a float
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - correlation_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - AUTH_REQUIRED
          - FORBIDDEN
          - NOT_FOUND
          - VALIDATION_FAILED
          - CONFLICT_VERSION
          - STATE_TRANSITION_INVALID
          - DUPLICATE_RESOURCE
          - IDEMPOTENCY_MISMATCH
          - POLICY_BLOCKED
          - IMPORT_VALIDATION_FAILED
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - RATE_LIMITED
          - INTEGRATION_UNAVAILABLE
          - AI_UNAVAILABLE
          - INTERNAL_ERROR
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        gate_results:
          type: array
          items:
            $ref: '#/components/schemas/GateResult'
        decision_id:
          type: string
          format: uuid
        correlation_id:
          type: string
    GateResult:
      type: object
      required:
      - gate
      - passed
      properties:
        gate:
          type: string
          pattern: ^G(1[0-5]|[1-9])$
        passed:
          type: boolean
        reason:
          type: string
    PaymentStatus:
      type: string
      enum:
      - OUTSTANDING
      - PARTIALLY_PAID
      - AWAITING_VERIFICATION
      - UNCERTAIN
      - PAID_VERIFIED
      description: Derived only; there is no mark-paid action.
    PolicyOutcome:
      type: string
      enum:
      - ALLOW_AUTOMATIC
      - REQUIRE_APPROVAL
      - DENY
      - DEFER
      - PAUSE_FOR_REVIEW
      - CANCEL
    Page:
      type: object
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type:
          - string
          - 'null'
  responses:
    Problem400:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: AUTH_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: FORBIDDEN
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: NOT_FOUND (also used for cross-tenant IDs)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Conflict / POLICY_BLOCKED / STATE_TRANSITION_INVALID / CONFLICT_VERSION
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: VALIDATION_FAILED / IDEMPOTENCY_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: RATE_LIMITED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
